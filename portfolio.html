<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>持股追蹤</title>
<style>
  :root {
    --bg:#0d1117; --sur:#161b22; --bor:#21262d;
    --text:#e6edf3; --mute:#8b949e;
    --up:#f85149; --dn:#3fb950; --blue:#58a6ff; --warn:#d29922;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
  button{cursor:pointer;font-family:inherit}
  input,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--bor);border-radius:2px}

  /* Header */
  .hdr{background:var(--sur);border-bottom:1px solid var(--bor);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:10}
  .h-title{font-size:17px;font-weight:700}
  .h-sub{font-size:10px;color:var(--mute);margin-top:2px}
  .h-stats{display:flex;gap:14px;flex-wrap:wrap}
  .stat{text-align:right}
  .stat-lbl{font-size:10px;color:var(--mute);margin-bottom:1px}
  .stat-val{font-size:14px;font-weight:700}

  /* Save bar */
  .save-bar{background:#0d2137;border-bottom:1px solid var(--bor);padding:5px 16px;font-size:11px;color:var(--mute);display:flex;justify-content:space-between}

  /* Tabs */
  .tabs{display:flex;background:var(--sur);border-bottom:1px solid var(--bor);padding:0 14px;overflow-x:auto}
  .tab{background:none;border:none;color:var(--mute);padding:10px 12px;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue)}

  /* Actions */
  .acts{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
  .btn-p{background:var(--blue);color:#0d1117;border:none;border-radius:6px;padding:7px 12px;font-weight:600;font-size:13px}
  .btn-s{background:var(--sur);color:var(--text);border:1px solid var(--bor);border-radius:6px;padding:7px 12px;font-size:13px}
  .btn-warn{background:var(--sur);color:var(--warn);border:1px solid var(--bor);border-radius:6px;padding:7px 12px;font-size:12px}
  .btn-d{background:none;color:var(--dn);border:none;padding:2px 5px;font-size:13px}
  .btn-e{background:none;color:var(--mute);border:none;padding:2px 5px;font-size:13px}

  /* Table */
  .tbl-wrap{overflow-x:auto;padding:0 14px 80px}
  table{width:100%;border-collapse:collapse;min-width:700px}
  th{padding:8px 10px;text-align:left;color:var(--mute);font-weight:500;font-size:11px;border-bottom:1px solid var(--bor);white-space:nowrap;background:var(--bg);position:sticky;top:0}
  td{padding:8px 10px;font-size:13px;vertical-align:middle;border-bottom:1px solid var(--bor)}
  .code-cell{font-family:monospace;font-weight:600;color:var(--blue)}
  .empty{padding:50px 0;text-align:center;color:var(--mute);font-size:14px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal{background:var(--sur);border:1px solid var(--bor);border-radius:12px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto}
  .modal-title{font-size:15px;font-weight:700}
  .form-grid{display:grid;grid-template-columns:72px 1fr;gap:8px 10px;align-items:center}
  .form-lbl{font-size:12px;color:var(--mute)}
  .form-inp{background:var(--bg);border:1px solid var(--bor);border-radius:6px;color:var(--text);padding:7px 10px;font-size:13px;width:100%;outline:none}
  .form-inp:focus{border-color:var(--blue)}
  .toggle-wrap{display:flex;gap:8px}
  .toggle-btn{background:var(--bg);border:1px solid var(--bor);border-radius:6px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--text)}
  .toggle-btn.active{border-color:currentColor;background:rgba(255,255,255,0.05)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

  /* Toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;border:1px solid #374151;color:var(--text);padding:9px 18px;border-radius:8px;font-size:13px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,0.4);white-space:nowrap;pointer-events:none}

  /* Confirm */
  .confirm-box{background:var(--sur);border:1px solid var(--bor);border-radius:12px;padding:20px;width:100%;max-width:280px;display:flex;flex-direction:column;gap:14px}

  .up{color:var(--up)} .dn{color:var(--dn)} .mute{color:var(--mute)}
  .tr{text-align:right}
  .fetching{opacity:0.6;pointer-events:none}

  /* Batch form */
  .batch-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--bor)}
  .batch-row:last-child{border-bottom:none}
</style>
</head>
<body>

<div id="app"></div>

<script>
const TW_STOCKS = {
  "1101":"台泥","1102":"亞泥","1216":"統一","1301":"台塑","1303":"南亞","1326":"台化",
  "1402":"遠東新","1476":"儒鴻","1519":"華城","1590":"亞德客-KY","1802":"台玻",
  "2002":"中鋼","2049":"上銀","2059":"川湖","2105":"正新","2207":"和泰車",
  "2301":"光寶科","2303":"聯電","2308":"台達電","2312":"金寶","2313":"華通",
  "2317":"鴻海","2324":"仁寶","2327":"國巨","2330":"台積電","2337":"旺宏",
  "2344":"華邦電","2347":"聯強","2353":"宏碁","2356":"英業達","2357":"華碩",
  "2360":"致茂","2376":"技嘉","2377":"微星","2379":"瑞昱","2382":"廣達",
  "2395":"研華","2408":"南亞科","2409":"友達","2412":"中華電","2448":"晶電",
  "2454":"聯發科","2458":"義隆","2464":"盟立","2476":"鉅祥","2493":"揚博",
  "2498":"宏達電","2603":"長榮","2609":"陽明","2610":"華航","2615":"萬海",
  "2618":"長榮航","2707":"晶華","2727":"王品","2731":"雄獅","2801":"彰銀",
  "2880":"華南金","2881":"富邦金","2882":"國泰金","2883":"開發金","2884":"玉山金",
  "2885":"元大金","2886":"兆豐金","2887":"台新金","2888":"新光金","2890":"永豐金",
  "2891":"中信金","2892":"第一金","2912":"統一超","3008":"大立光","3023":"信邦",
  "3026":"禾伸堂","3034":"聯詠","3035":"智原","3036":"文曄","3037":"欣興",
  "3045":"台灣大","3084":"可成","3099":"美律","3105":"穩懋","3115":"奇鋐",
  "3131":"弘塑","3132":"超眾","3189":"景碩","3231":"緯創","3293":"鈊象",
  "3324":"雙鴻","4749":"新複材","4958":"臻鼎-KY","5289":"宜鼎","5483":"中美晶",
  "5536":"聖暉","5876":"上海商銀","5880":"合庫金","6147":"頎邦","6176":"瑞儀",
  "6202":"盛群","6209":"今國光","6213":"聯茂","6239":"力成","6269":"台郡",
  "6271":"同欣電","6282":"康舒","6286":"立錡","6299":"藥華藥","6300":"保瑞",
  "6409":"旭隼","6410":"精測","6415":"矽力-KY","6416":"創意","6421":"晶心科",
  "6488":"環球晶","6505":"台塑化","7853":"政美應用","8021":"尖點","8064":"東捷",
  "8069":"元太","8086":"宏捷科","8299":"群聯","8454":"富邦媒","9802":"鈺齊-KY",
};

const DATA_KEY = "ptf_v1";
let state = { txs:[], prices:{}, names:{}, reasons:{}, watch:{} };
let currentTab = "portfolio";
let toastTimer = null;

// ── Storage ──
const GAS_URL = "https://script.google.com/macros/s/AKfycbzEBiR-Ul5Gvf14fedVrwjzZc-D5bmYHU-c-92yD2m4WgCsT9oFP30RmGz4d-V5AEGq_A/exec";

async function loadData() {
  // 先從 localStorage 載入（離線也能用）
  try {
    const raw = localStorage.getItem(DATA_KEY);
    if (raw) { const p = JSON.parse(raw); if (p && typeof p==="object") state = {...state,...p}; }
  } catch(e) {}
  // 再從 Google Sheets 同步（有網路時覆蓋）
  try {
    const r = await fetch(GAS_URL);
    const d = await r.json();
    if (d && typeof d==="object" && d.status!=="empty" && d.status!=="error") {
      state = {txs:Array.isArray(d.txs)?d.txs:[],prices:d.prices||{},names:d.names||{},reasons:d.reasons||{},watch:d.watch||{}};
      localStorage.setItem(DATA_KEY, JSON.stringify({...state,_savedAt:d._savedAt||""}));
    }
  } catch(e) {}
}

async function saveData() {
  const payload = {...state, _savedAt: nowStr()};
  // 同時存 localStorage（快）和 Google Sheets（永久）
  try { localStorage.setItem(DATA_KEY, JSON.stringify(payload)); } catch(e) {}
  try {
    await fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(payload),
      headers: {"Content-Type":"text/plain"}
    });
  } catch(e) {}
  return true;
}

// ── Helpers ──
function nowStr() {
  return new Date().toLocaleString("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function nowShort() {
  return new Date().toLocaleString("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function todayStr() {
  return new Date().toLocaleDateString("sv",{timeZone:"Asia/Taipei"});
}
function N(n, d=2) {
  if (n==null||isNaN(n)) return "-";
  return Number(n).toLocaleString("zh-TW",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function P(n) {
  if (n==null||isNaN(n)) return "-";
  return (n>=0?"+":"")+Number(n).toFixed(2)+"%";
}
function lookupByCode(code) { return TW_STOCKS[code?.trim()]||state.names[code?.trim()]||""; }
function lookupByName(name) {
  const found = Object.entries(TW_STOCKS).find(([,v])=>v===name?.trim());
  return found?found[0]:"";
}

// ── Portfolio calc ──
function calcPortfolio() {
  const map = {};
  for (const tx of state.txs) {
    if (!map[tx.code]) map[tx.code]={code:tx.code,shares:0,cost:0,realized:0};
    const s=map[tx.code];
    if (tx.action==="買入") { s.cost+=tx.shares*tx.price; s.shares+=tx.shares; }
    else {
      const avg=s.shares>0?s.cost/s.shares:0;
      s.realized+=(tx.price-avg)*tx.shares;
      s.cost-=avg*tx.shares; s.shares-=tx.shares;
      if(s.shares<=0){s.shares=0;s.cost=0;}
    }
  }
  const totalCost = Object.values(map).reduce((a,s)=>a+s.cost,0);
  return Object.values(map).filter(s=>s.shares>0).map(s=>{
    const avg=s.shares>0?s.cost/s.shares:0;
    const pi=state.prices[s.code];
    const cur=pi?pi.price:null;
    return {
      code:s.code, name:state.names[s.code]||TW_STOCKS[s.code]||"-",
      shares:s.shares, avg, cur, updatedAt:pi?pi.updatedAt:null,
      unreal:cur!==null?(cur-avg)*s.shares:null,
      realized:s.realized,
      rate:cur!==null&&avg>0?((cur-avg)/avg)*100:null,
      weight:totalCost>0?(s.cost/totalCost)*100:0,
      reason:state.reasons[s.code]||"",
    };
  });
}

// ── Toast ──
function showToast(msg, duration=2500) {
  let el = document.getElementById("toast");
  if (!el) { el=document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el); }
  el.textContent=msg; el.style.display="block";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ if(el) el.style.display="none"; }, duration);
}

// ── Auto-fetch prices ──
let fetchingPrices = false;
async function fetchPrices() {
  const portfolio = calcPortfolio();
  if (!portfolio.length) { showToast("尚無持股"); return; }
  if (fetchingPrices) return;
  fetchingPrices = true;
  const btn = document.getElementById("fetch-btn");
  if (btn) { btn.textContent="查詢中…"; btn.classList.add("fetching"); }
  showToast("⏳ 查詢現價中…");

  const now = nowShort();
  const today = todayStr();
  let ok = 0;

  await Promise.all(portfolio.map(async r => {
    const code = r.code;
    // 1. mis.twse (即時)
    try {
      const res = await fetch(`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_${code}.tw|otc_${code}.tw&json=1&delay=0`);
      const d = await res.json();
      for (const s of (d.msgArray||[])) {
        const p = parseFloat(s.z)>0?parseFloat(s.z):parseFloat(s.y);
        if (s.c===code && !isNaN(p) && p>0) { state.prices[code]={price:p,updatedAt:now}; ok++; return; }
      }
    } catch(e) {}
    // 2. FinMind
    try {
      const res = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${code}&start_date=${today}`);
      const d = await res.json();
      if (d.status===200 && d.data?.length>0) {
        const p = parseFloat(d.data[d.data.length-1].close);
        if (!isNaN(p)&&p>0) { state.prices[code]={price:p,updatedAt:now}; ok++; return; }
      }
    } catch(e) {}
    // 3. Yahoo Finance
    try {
      const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${code}.TW?interval=1d&range=1d`);
      const d = await res.json();
      const p = d?.chart?.result?.[0]?.meta?.regularMarketPrice;
      if (p && p>0) { state.prices[code]={price:p,updatedAt:now}; ok++; return; }
    } catch(e) {}
  }));

  saveData();
  fetchingPrices=false;
  if (btn) { btn.textContent="🔄 自動現價"; btn.classList.remove("fetching"); }
  render();
  if (ok>0) showToast(`✅ 更新 ${ok} 支現價`);
  else showToast("⚠️ 查無資料，請手動輸入");
}

// ── Modal helpers ──
function openModal(id) { document.getElementById(id).style.display="flex"; }
function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.remove(); // 完全移除，不只是隱藏
}
function closeAllModals() {
  document.querySelectorAll(".overlay").forEach(m=>m.remove());
}

// ── Render ──
function render() {
  const portfolio = calcPortfolio();
  const totalUnreal = portfolio.reduce((a,r)=>a+(r.unreal??0),0);
  const totalReal = portfolio.reduce((a,r)=>a+r.realized,0);
  const totalCost = portfolio.reduce((a,r)=>a+r.avg*r.shares,0);
  const totalRate = totalCost>0?(totalUnreal/totalCost)*100:null;

  const savedAt = (() => { try { const r=JSON.parse(localStorage.getItem(DATA_KEY)); return r?._savedAt||""; } catch(e){return "";} })();

  document.getElementById("app").innerHTML = `
  <!-- Header -->
  <div class="hdr">
    <div><div class="h-title">持股追蹤</div><div class="h-sub">Portfolio Tracker</div></div>
    <div class="h-stats">
      <div class="stat"><div class="stat-lbl">未實現損益</div><div class="stat-val ${totalUnreal>=0?"up":"dn"}">${totalUnreal>=0?"+":""}${N(totalUnreal,0)}</div></div>
      <div class="stat"><div class="stat-lbl">已實現損益</div><div class="stat-val ${totalReal>=0?"up":"dn"}">${totalReal>=0?"+":""}${N(totalReal,0)}</div></div>
      ${totalRate!==null?`<div class="stat"><div class="stat-lbl">整體報酬率</div><div class="stat-val ${totalRate>=0?"up":"dn"}">${P(totalRate)}</div></div>`:""}
    </div>
  </div>

  <!-- Save bar -->
  <div class="save-bar">
    <span>${savedAt?"✅ 已儲存 "+savedAt:"尚未儲存"}</span>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab ${currentTab==="portfolio"?"active":""}" onclick="switchTab('portfolio')">📊 持股損益</button>
    <button class="tab ${currentTab==="log"?"active":""}" onclick="switchTab('log')">📋 交易紀錄</button>
    <button class="tab ${currentTab==="watch"?"active":""}" onclick="switchTab('watch')">👀 關注股票</button>
  </div>

  <!-- Actions -->
  <div class="acts">
    <button class="btn-p" onclick="openTxForm(null)">＋ 新增交易</button>
    <button class="btn-s" id="fetch-btn" onclick="fetchPrices()">🔄 自動現價</button>
    <button class="btn-s" onclick="openBatch()">📝 批量現價</button>
    ${currentTab==="watch"?'<button class="btn-s" onclick="openWatchForm(null)">＋ 新增關注</button>':""}
    <button class="btn-warn" onclick="openBackup()">💾 備份/還原</button>
  </div>

  <!-- Portfolio -->
  ${currentTab==="portfolio"?`
  <div class="tbl-wrap">
    ${portfolio.length===0?'<div class="empty">尚無持股，點「新增交易」開始記錄</div>':`
    <table>
      <thead><tr>
        <th>代號</th><th>名稱</th><th>股數</th><th>成本均價</th><th>現價</th><th>現價更新時間</th><th>成本水位</th><th>損益率</th><th>未實現損益</th><th>已實現損益</th><th>買進理由</th>
      </tr></thead>
      <tbody>${portfolio.map(r=>`
        <tr>
          <td class="code-cell">${r.code}</td>
          <td>${r.name}</td>
          <td class="tr">${N(r.shares,0)}</td>
          <td class="tr">${N(r.avg)}</td>
          <td class="tr">${r.cur!==null?N(r.cur):"-"}</td>
          <td class="mute" style="font-size:11px">${r.updatedAt||"-"}</td>
          <td class="tr">${N(r.weight,1)}%</td>
          <td class="tr ${r.rate==null?"mute":r.rate>=0?"up":"dn"}" style="font-weight:600">${P(r.rate)}</td>
          <td class="tr ${r.unreal==null?"mute":r.unreal>=0?"up":"dn"}">${r.unreal!=null?(r.unreal>=0?"+":"")+N(r.unreal,0):"-"}</td>
          <td class="tr ${r.realized>=0?"up":"dn"}">${(r.realized>=0?"+":"")+N(r.realized,0)}</td>
          <td style="min-width:140px">
            <div style="display:flex;align-items:center;gap:6px">
              <span class="mute" style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.reason||"-"}</span>
              <button class="btn-e" onclick="openReasonForm('${r.code}')">✎</button>
            </div>
          </td>
        </tr>`).join("")}
      </tbody>
    </table>`}
  </div>`:""}

  <!-- Log -->
  ${currentTab==="log"?`
  <div class="tbl-wrap">
    ${state.txs.length===0?'<div class="empty">尚無交易紀錄</div>':`
    <table>
      <thead><tr><th>日期</th><th>代號</th><th>名稱</th><th>買/賣</th><th>股數</th><th>價格</th><th>金額</th><th>備註</th><th></th></tr></thead>
      <tbody>${state.txs.map(tx=>`
        <tr>
          <td>${tx.date}</td>
          <td class="code-cell">${tx.code}</td>
          <td>${tx.name||state.names[tx.code]||"-"}</td>
          <td class="${tx.action==="買入"?"up":"dn"}" style="font-weight:600">${tx.action}</td>
          <td class="tr">${N(tx.shares,0)}</td>
          <td class="tr">${N(tx.price)}</td>
          <td class="tr">${N(tx.shares*tx.price,0)}</td>
          <td>${tx.note||"-"}</td>
          <td>
            <button class="btn-e" onclick="openTxForm('${tx.id}')">✎</button>
            <button class="btn-d" onclick="confirmDeleteTx('${tx.id}')">🗑</button>
          </td>
        </tr>`).join("")}
      </tbody>
    </table>`}
  </div>`:""}

  <!-- Watch -->
  ${currentTab==="watch"?`
  <div class="tbl-wrap">
    ${Object.keys(state.watch).length===0?'<div class="empty">尚無關注股票</div>':`
    <table>
      <thead><tr><th>代號</th><th>名稱</th><th>日期</th><th>買入區間</th><th>賣出區間</th><th>備註</th><th></th></tr></thead>
      <tbody>${Object.values(state.watch).map(w=>`
        <tr>
          <td class="code-cell">${w.code}</td>
          <td>${w.name||"-"}</td>
          <td>${w.date||"-"}</td>
          <td class="up">${w.buyLow||w.buyHigh?w.buyLow+"～"+w.buyHigh:"-"}</td>
          <td class="dn">${w.sellLow||w.sellHigh?w.sellLow+"～"+w.sellHigh:"-"}</td>
          <td class="mute">${w.note||"-"}</td>
          <td>
            <button class="btn-e" onclick="openWatchForm('${w.code}')">✎</button>
            <button class="btn-d" onclick="confirmDeleteWatch('${w.code}')">🗑</button>
          </td>
        </tr>`).join("")}
      </tbody>
    </table>`}
  </div>`:""}
  `;
}

function switchTab(tab) { currentTab=tab; render(); }

// ── Transaction Form ──
let editTxId = null;
function openTxForm(id) {
  editTxId = id;
  const tx = id ? state.txs.find(t=>String(t.id)===String(id)) : null;
  const d = tx || {date:new Date().toISOString().slice(0,10),code:"",name:"",action:"買入",shares:"",price:"",note:""};
  document.body.insertAdjacentHTML("beforeend",`
  <div class="overlay" id="tx-modal" onclick="if(event.target===this)closeModal('tx-modal')">
    <div class="modal">
      <div class="modal-title">${id?"編輯交易":"新增交易"}</div>
      <div class="form-grid">
        <label class="form-lbl">日期</label><input class="form-inp" type="date" id="f-date" value="${d.date}">
        <label class="form-lbl">代號</label><input class="form-inp" id="f-code" placeholder="例：2330" value="${d.code}" oninput="autoFillName()">
        <label class="form-lbl">名稱</label><input class="form-inp" id="f-name" placeholder="例：台積電" value="${d.name}" oninput="autoFillCode()">
        <label class="form-lbl">買/賣</label>
        <div class="toggle-wrap">
          <button class="toggle-btn ${d.action==="買入"?"active":""}" style="color:var(--up)" onclick="setAction('買入',this)">買入</button>
          <button class="toggle-btn ${d.action==="賣出"?"active":""}" style="color:var(--dn)" onclick="setAction('賣出',this)">賣出</button>
        </div>
        <label class="form-lbl">股數</label><input class="form-inp" type="number" id="f-shares" value="${d.shares}" placeholder="例：1000">
        <label class="form-lbl">價格</label><input class="form-inp" type="number" id="f-price" value="${d.price}" placeholder="例：950">
        <label class="form-lbl">備註</label><input class="form-inp" id="f-note" value="${d.note||""}" placeholder="選填">
      </div>
      <div class="modal-actions">
        <button class="btn-s" onclick="closeModal('tx-modal')">取消</button>
        <button class="btn-p" onclick="submitTx()">${id?"確認修改":"確認新增"}</button>
      </div>
    </div>
  </div>`);
}
function setAction(a,btn) {
  document.querySelectorAll("#tx-modal .toggle-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); btn.dataset.action=a;
}
function autoFillName() {
  const code = document.getElementById("f-code")?.value;
  const name = lookupByCode(code);
  if (name) document.getElementById("f-name").value=name;
}
function autoFillCode() {
  const name = document.getElementById("f-name")?.value;
  const code = lookupByName(name);
  if (code) document.getElementById("f-code").value=code;
}
async function submitTx() {
  const date=document.getElementById("f-date").value;
  const code=document.getElementById("f-code").value.trim();
  const name=document.getElementById("f-name").value.trim();
  const actionBtn=document.querySelector("#tx-modal .toggle-btn.active");
  const action=actionBtn?actionBtn.textContent:"買入";
  const shares=parseFloat(document.getElementById("f-shares").value);
  const price=parseFloat(document.getElementById("f-price").value);
  const note=document.getElementById("f-note").value;
  if (!code||isNaN(shares)||isNaN(price)) { showToast("請填完代號、股數、價格"); return; }

  // 立刻禁用按鈕防止重複點擊
  const btn = document.querySelector("#tx-modal .btn-p");
  if (btn) { btn.disabled=true; btn.textContent="儲存中…"; }

  if (editTxId) {
    state.txs=state.txs.map(t=>String(t.id)===String(editTxId)?{...t,date,code,name,action,shares,price,note}:t);
  } else {
    state.txs=[{id:Date.now(),date,code,name,action,shares,price,note},...state.txs];
  }
  if (name) state.names[code]=name;

  // 先關視窗更新畫面，背景存檔
  closeModal("tx-modal"); currentTab="portfolio"; render();
  showToast(editTxId?"✅ 已修改":"✅ 已新增");
  saveData(); // 背景執行，不等待
}

// ── Confirm Delete Tx ──
function confirmDeleteTx(id) {
  document.body.insertAdjacentHTML("beforeend",`
  <div class="overlay" id="confirm-tx" onclick="if(event.target===this)closeModal('confirm-tx')">
    <div class="confirm-box">
      <div style="font-size:15px;font-weight:600">確定刪除？</div>
      <div class="mute" style="font-size:13px">持股損益將自動重算</div>
      <div class="modal-actions">
        <button class="btn-s" onclick="closeModal('confirm-tx')">取消</button>
        <button class="btn-p" style="background:var(--dn)" onclick="deleteTx('${id}')">確定刪除</button>
      </div>
    </div>
  </div>`);
}
async function deleteTx(id) {
  state.txs=state.txs.filter(t=>String(t.id)!==String(id));
  closeModal("confirm-tx"); render(); showToast("🗑 已刪除");
  saveData();
}

// ── Price ──
function openBatch() {
  const portfolio = calcPortfolio();
  if (!portfolio.length) { showToast("尚無持股"); return; }
  document.body.insertAdjacentHTML("beforeend",`
  <div class="overlay" id="batch-modal" onclick="if(event.target===this)closeModal('batch-modal')">
    <div class="modal" style="max-width:360px">
      <div class="modal-title">📝 批量更新現價</div>
      <div style="font-size:12px;color:var(--mute)">空白的不更新</div>
      <div style="max-height:300px;overflow-y:auto">
        ${portfolio.map(r=>`
        <div class="batch-row">
          <span class="code-cell" style="min-width:48px">${r.code}</span>
          <span class="mute" style="flex:1;font-size:12px">${r.name}</span>
          <input class="form-inp" type="number" style="width:90px;text-align:right" placeholder="現價" id="bp-${r.code}" value="${state.prices[r.code]?.price||""}">
        </div>`).join("")}
      </div>
      <div class="modal-actions">
        <button class="btn-s" onclick="closeModal('batch-modal')">取消</button>
        <button class="btn-p" onclick="submitBatch()">確認更新</button>
      </div>
    </div>
  </div>`);
}
async function submitBatch() {
  const btn = document.querySelector("#batch-modal .btn-p");
  if (btn) { btn.disabled=true; btn.textContent="儲存中…"; }
  const now=nowShort(); let ok=0;
  calcPortfolio().forEach(r=>{
    const v=parseFloat(document.getElementById("bp-"+r.code)?.value);
    if(!isNaN(v)&&v>0){state.prices[r.code]={price:v,updatedAt:now};ok++;}
  });
  closeModal("batch-modal"); render();
  if(ok>0) showToast("✅ 更新 "+ok+" 支現價");
  saveData();
}

// ── Reason ──
function openReasonForm(code) {
  document.body.insertAdjacentHTML("beforeend",`
  <div class="overlay" id="reason-modal" onclick="if(event.target===this)closeModal('reason-modal')">
    <div class="modal" style="max-width:360px">
      <div class="modal-title">買進理由 — ${code}</div>
      <textarea class="form-inp" id="reason-text" style="height:90px;resize:vertical">${state.reasons[code]||""}</textarea>
      <div class="modal-actions">
        <button class="btn-s" onclick="closeModal('reason-modal')">取消</button>
        <button class="btn-p" onclick="submitReason('${code}')">儲存</button>
      </div>
    </div>
  </div>`);
}
async function submitReason(code) {
  const btn = document.querySelector("#reason-modal .btn-p");
  if (btn) { btn.disabled=true; btn.textContent="儲存中…"; }
  state.reasons[code]=document.getElementById("reason-text").value;
  closeModal("reason-modal"); render(); showToast("✅ 已儲存");
  saveData();
}

// ── Watch ──
let editWatchCode = null;
function openWatchForm(code) {
  editWatchCode=code;
  const w=code?state.watch[code]:{code:"",name:"",date:new Date().toISOString().slice(0,10),buyLow:"",buyHigh:"",sellLow:"",sellHigh:"",note:""};
  document.body.insertAdjacentHTML("beforeend",`
  <div class="overlay" id="watch-modal" onclick="if(event.target===this)closeModal('watch-modal')">
    <div class="modal">
      <div class="modal-title">${code?"編輯關注":"新增關注"}</div>
      <div class="form-grid">
        <label class="form-lbl">代號</label><input class="form-inp" id="w-code" value="${w.code}" placeholder="例：2330" oninput="autoFillWName()">
        <label class="form-lbl">名稱</label><input class="form-inp" id="w-name" value="${w.name}" placeholder="例：台積電" oninput="autoFillWCode()">
        <label class="form-lbl">日期</label><input class="form-inp" type="date" id="w-date" value="${w.date}">
        <label class="form-lbl">買入低點</label><input class="form-inp" type="number" id="w-buyL" value="${w.buyLow||""}">
        <label class="form-lbl">買入高點</label><input class="form-inp" type="number" id="w-buyH" value="${w.buyHigh||""}">
        <label class="form-lbl">賣出低點</label><input class="form-inp" type="number" id="w-sellL" value="${w.sellLow||""}">
        <label class="form-lbl">賣出高點</label><input class="form-inp" type="number" id="w-sellH" value="${w.sellHigh||""}">
        <label class="form-lbl">備註</label><input class="form-inp" id="w-note" value="${w.note||""}">
      </div>
      <div class="modal-actions">
        <button class="btn-s" onclick="closeModal('watch-modal')">取消</button>
        <button class="btn-p" onclick="submitWatch()">確認</button>
      </div>
    </div>
  </div>`);
}
function autoFillWName(){const n=lookupByCode(document.getElementById("w-code")?.value);if(n)document.getElementById("w-name").value=n;}
function autoFillWCode(){const c=lookupByName(document.getElementById("w-name")?.value);if(c)document.getElementById("w-code").value=c;}
async function submitWatch() {
  const code=document.getElementById("w-code").value.trim();
  if (!code) return;
  const btn = document.querySelector("#watch-modal .btn-p");
  if (btn) { btn.disabled=true; btn.textContent="儲存中…"; }
  state.watch[code]={code,name:document.getElementById("w-name").value.trim(),date:document.getElementById("w-date").value,buyLow:document.getElementById("w-buyL").value,buyHigh:document.getElementById("w-buyH").value,sellLow:document.getElementById("w-sellL").value,sellHigh:document.getElementById("w-sellH").value,note:document.getElementById("w-note").value};
  closeModal("watch-modal"); render(); showToast("👀 已加入關注");
  saveData();
}
function confirmDeleteWatch(code) {
  document.body.insertAdjacentHTML("beforeend",`
  <div class="overlay" id="confirm-w" onclick="if(event.target===this)closeModal('confirm-w')">
    <div class="confirm-box">
      <div style="font-size:15px;font-weight:600">移除關注 ${code}？</div>
      <div class="modal-actions">
        <button class="btn-s" onclick="closeModal('confirm-w')">取消</button>
        <button class="btn-p" style="background:var(--dn)" onclick="deleteWatch('${code}')">確定移除</button>
      </div>
    </div>
  </div>`);
}
async function deleteWatch(code){delete state.watch[code];await saveData();closeModal("confirm-w");render();showToast("🗑 已移除");}

// ── Backup ──
function openBackup() {
  document.body.insertAdjacentHTML("beforeend",`
  <div class="overlay" id="backup-modal" onclick="if(event.target===this)closeModal('backup-modal')">
    <div class="modal" style="max-width:420px">
      <div class="modal-title">💾 備份 / 還原</div>
      <div style="font-size:12px;color:var(--mute)">備份：複製以下文字存到備忘錄；還原：貼上後點還原</div>
      <textarea class="form-inp" id="backup-text" style="height:120px;font-size:11px;font-family:monospace;resize:none">${JSON.stringify(state)}</textarea>
      <div class="modal-actions">
        <button class="btn-s" onclick="copyBackup()">複製備份</button>
        <button class="btn-p" onclick="restoreBackup()">還原</button>
        <button class="btn-s" onclick="closeModal('backup-modal')">關閉</button>
      </div>
    </div>
  </div>`);
}
function copyBackup(){
  const el=document.getElementById("backup-text"); el.select();
  try{navigator.clipboard.writeText(el.value);showToast("✅ 已複製");}
  catch(e){showToast("請長按文字框手動複製");}
}
async function restoreBackup(){
  try{
    const p=JSON.parse(document.getElementById("backup-text").value);
    state={txs:Array.isArray(p.txs)?p.txs:[],prices:p.prices||{},names:p.names||{},reasons:p.reasons||{},watch:p.watch||{}};
    await saveData();closeModal("backup-modal");render();showToast("✅ 還原成功");
  }catch(e){showToast("❌ 格式錯誤");}
}

// ── Init ──
(async () => {
  document.getElementById("app").innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:60vh;color:#8b949e;font-size:14px;flex-direction:column;gap:12px"><div style="width:28px;height:28px;border:2px solid #21262d;border-top-color:#58a6ff;border-radius:50%;animation:spin 1s linear infinite"></div>載入中…</div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
  await loadData();
  render();
})();
</script>
</body>
</html>
